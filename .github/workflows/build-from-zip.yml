name: Build Noctis from ZIP

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extrair ZIP do projeto
        run: unzip -o "*.zip"

      - name: Instalar dependências e sincronizar Capacitor
        working-directory: streaming-player
        run: |
          npm install
          npm run build
          npx cap sync android

      - name: Compilar APK Debug
        working-directory: streaming-player/android
        run: gradle assembleDebug --no-daemon

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Noctis-Debug-APK
          path: streaming-player/android/app/build/outputs/apk/debug/app-debug.apk
